<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayukh Solar — No connection</title>
    <!--
      Served by the Capacitor shell (server.errorPath in capacitor.config.ts)
      when the remote app origin cannot be reached at startup, so the user gets
      a real screen instead of a blank WebView. It is a bundled asset: it must
      stand alone with no network dependency, no fonts, and no scripts beyond
      this file.
    -->
    <style>
      :root { color-scheme: light dark; --bg: #f8fafb; --fg: #0e1729; --muted: #64748b; --accent: #bd4308; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d1626; --fg: #f1f5fb; --muted: #94a3b8; } }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        padding: 24px calc(24px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(24px + env(safe-area-inset-left, 0px));
        text-align: center; background: var(--bg); color: var(--fg);
        font: 400 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; max-width: 32ch; color: var(--muted); }
      .mark { font-size: 40px; }
      button {
        margin-top: 8px; min-height: 44px; padding: 0 24px; border: 0; border-radius: 8px;
        background: var(--accent); color: #fff; font: 600 15px/1 inherit; font-family: inherit;
      }
      button[disabled] { opacity: 0.6; }
      .status { min-height: 1.2em; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">⚡</div>
    <h1>No internet connection</h1>
    <p>
      Mayukh Solar needs a connection to load your leads, site visits and
      projects. We will retry automatically as soon as you are back online.
    </p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <script>
      // The shell rewrites this at build time; see scripts/sync-offline-url.mjs.
      var APP_URL = '__CAP_SERVER_URL__';

      var retry = document.getElementById('retry');
      var status = document.getElementById('status');
      var attempts = 0;

      function goToApp() {
        if (APP_URL.indexOf('__CAP') === 0) {
          // URL was never injected — a plain reload still re-runs the shell's
          // own load of server.url, which is the right fallback.
          window.location.reload();
          return;
        }
        window.location.replace(APP_URL);
      }

      function attempt(manual) {
        if (!navigator.onLine) {
          status.textContent = manual ? 'Still offline.' : '';
          return;
        }
        attempts += 1;
        retry.disabled = true;
        status.textContent = 'Reconnecting…';
        goToApp();
      }

      retry.addEventListener('click', function () { attempt(true); });
      window.addEventListener('online', function () { attempt(false); });

      // Backstop for platforms where the `online` event is unreliable inside a
      // WebView: poll with a widening interval, capped, so a device that
      // regains data while the screen is off still recovers on wake.
      (function poll() {
        var delay = Math.min(3000 * Math.pow(1.5, attempts), 30000);
        setTimeout(function () {
          if (navigator.onLine) attempt(false);
          poll();
        }, delay);
      })();
    </script>
  </body>
</html>
